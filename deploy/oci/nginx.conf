# Production Nginx config for IKAS on OCI
# Placed at: /etc/nginx/conf.d/ikas.conf (or via Docker volume mount)
#
# Phase 1 (HTTP only — before domain/SSL):
#   Use the server block labelled "HTTP only".
#   Comment out the HTTPS block.
#
# Phase 2 (with domain + SSL via Let's Encrypt):
#   Run: certbot --nginx -d yourdomain.com
#   Then uncomment the HTTPS block and remove/redirect the HTTP one.

# ─── Rate limiting ────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# ─── HTTP — redirect to HTTPS (enable after SSL is configured) ────────────────
# server {
#     listen 80;
#     server_name yourdomain.com;
#     return 301 https://$host$request_uri;
# }

# ─── HTTP only (use this until you have a domain + SSL cert) ─────────────────
server {
    listen 80;
    server_name _;          # matches any hostname / IP

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API proxy → backend container ─────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # CORS is handled by Flask — don't double-set here
    }

    # ── Stricter rate limit on auth endpoints ─────────────────────────────────
    location ~ ^/api/v1/(login|register) {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── SPA fallback — React Router handles all frontend routes ──────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets aggressively ─────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Health check endpoint (for OCI load balancer) ─────────────────────────
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

# ─── HTTPS (uncomment after running certbot) ──────────────────────────────────
# server {
#     listen 443 ssl http2;
#     server_name yourdomain.com;
#
#     ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#
#     # ... same location blocks as HTTP above ...
# }
